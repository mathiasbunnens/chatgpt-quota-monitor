name: Desktop checks
on:
  push:
    branches:
      - multi_platform_support
  pull_request:
    branches:
      - main
      - dev
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify pull request
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Ev '(^|/)[^/]+\.md$|^docs/|^LICENSE$' | grep -q .; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No application code changed; build checks are not required."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.changes.outputs.code_changed == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.code_changed == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.code_changed == 'true'
        with:
          workspaces: ./src-tauri -> target
      - if: needs.changes.outputs.code_changed == 'true'
        run: npm ci
      - if: needs.changes.outputs.code_changed == 'true'
        run: npm run build
      - if: needs.changes.outputs.code_changed == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - if: needs.changes.outputs.code_changed == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build release binary on Linux
        if: needs.changes.outputs.code_changed == 'true' && runner.os == 'Linux'
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop binary with Tauri
        if: needs.changes.outputs.code_changed == 'true' && runner.os != 'Linux'
        run: npm run tauri build -- --no-bundle
