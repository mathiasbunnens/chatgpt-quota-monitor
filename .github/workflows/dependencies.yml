name: Dependency checks
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify pull request
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Ev '(^|/)[^/]+\.md$|^docs/|^LICENSE$' | grep -q .; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "No application code changed; dependency audits are not required."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code_changed == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes.outputs.code_changed == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.changes.outputs.code_changed == 'true'
      - name: Check npm advisories
        if: needs.changes.outputs.code_changed == 'true'
        run: npm audit
      - name: Install Rust auditor
        if: needs.changes.outputs.code_changed == 'true' && (success() || failure())
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check Rust advisories (includes all locked targets)
        if: needs.changes.outputs.code_changed == 'true' && (success() || failure())
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Include known findings and review limitations
        if: needs.changes.outputs.code_changed == 'true' && always()
        run: cat docs/SECURITY_REVIEW.md >> "$GITHUB_STEP_SUMMARY"
